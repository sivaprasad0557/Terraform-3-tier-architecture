name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Backenddeployment/**'
      - '.github/workflows/backend-ci-cd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Backenddeployment/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: contact-backend

jobs:

  # ==========================================
  # JOB 1 - BUILD AND VALIDATE
  # ==========================================
  build-test:
    name: Build & Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backenddeployment

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backenddeployment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: node --check server.js


  # ==========================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGE
  # ==========================================
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: Backenddeployment
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest


  # ==========================================
  # JOB 3 - DEPLOY TO EC2
  # ==========================================
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: docker-publish

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Starting Backend Deployment"
            echo "======================================"

            echo "Logging in to ECR..."

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            echo "ECR login successful"


            echo "======================================"
            echo "Pulling Docker Image"
            echo "======================================"

            docker pull \
              ${{ steps.login-ecr.outputs.registry }}/contact-backend:${{ github.sha }}


            echo "======================================"
            echo "Stopping Old Backend Container"
            echo "======================================"

            docker stop backend || true
            docker rm backend || true


            echo "======================================"
            echo "Starting New Backend Container"
            echo "======================================"

            docker run -d \
              --name backend \
              --restart unless-stopped \
              --network app-network \
              --env-file /home/ubuntu/backend.env \
              -p 5000:5000 \
              ${{ steps.login-ecr.outputs.registry }}/contact-backend:${{ github.sha }}


            echo "Backend container started"


            echo "======================================"
            echo "Waiting for Backend"
            echo "======================================"

            sleep 10


            echo "======================================"
            echo "Checking Backend Health"
            echo "======================================"

            curl --fail http://localhost:5000/

            echo "Backend health check successful"


            echo "======================================"
            echo "Checking Backend API"
            echo "======================================"

            curl --fail http://localhost:5000/api/recipes

            echo ""
            echo "Backend API check successful"


            echo "======================================"
            echo "Deployment Successful"
            echo "======================================"
