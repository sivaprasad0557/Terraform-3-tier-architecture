name: AWS OIDC Test

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  aws-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          python - "$TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("===== GitHub OIDC Claims =====")
          print("iss:", claims.get("iss"))
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner:", claims.get("repository_owner"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("ref:", claims.get("ref"))
          print("workflow:", claims.get("workflow"))
          print("environment:", claims.get("environment"))
          print("================================")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Check AWS identity
        run: |
          echo "AWS authentication successful"
          aws sts get-caller-identity

      - name: Check AWS region
        run: |
          aws configure get region
