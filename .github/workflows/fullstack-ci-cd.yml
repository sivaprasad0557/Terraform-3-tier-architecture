name: Full Stack CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Backenddeployment/**'
      - 'Frontend deployment/**'
      - '.github/workflows/fullstack-ci-cd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Backenddeployment/**'
      - 'Frontend deployment/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "435957166878"

  BACKEND_ECR_REPOSITORY: contact-backend
  FRONTEND_ECR_REPOSITORY: frontend

jobs:

  # ==================================================
  # BACKEND - BUILD AND VALIDATE
  # ==================================================

  backend-build-test:
    name: Backend - Build & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backenddeployment

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backenddeployment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: node --check server.js


  # ==================================================
  # BACKEND - DOCKER BUILD AND PUSH
  # ==================================================

  backend-docker:
    name: Backend - Docker Build & Push
    runs-on: ubuntu-latest

    needs: backend-build-test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        working-directory: Backenddeployment
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest \
            .

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest


  # ==================================================
  # BACKEND - DEPLOY TO EC2
  # ==================================================

  backend-deploy:
    name: Backend - Deploy to EC2
    runs-on: ubuntu-latest

    needs: backend-docker

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "BACKEND DEPLOYMENT"
            echo "======================================"

            echo "Logging in to ECR..."

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            echo "Pulling backend image..."

            docker pull \
              ${{ steps.login-ecr.outputs.registry }}/contact-backend:${{ github.sha }}

            echo "Stopping old backend..."

            docker stop backend || true
            docker rm backend || true

            echo "Starting new backend..."

            docker run -d \
              --name backend \
              --restart unless-stopped \
              --network app-network \
              --env-file /home/ubuntu/backend.env \
              -p 5000:5000 \
              ${{ steps.login-ecr.outputs.registry }}/contact-backend:${{ github.sha }}

            echo "Waiting for backend..."

            sleep 10

            echo "Testing backend..."

            curl --fail http://localhost:5000/

            echo "Testing backend API..."

            curl --fail http://localhost:5000/api/recipes

            echo ""
            echo "Backend deployment successful!"


  # ==================================================
  # FRONTEND - BUILD AND VALIDATE
  # ==================================================

  frontend-build-test:
    name: Frontend - Build & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend deployment

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          echo "Checking frontend files..."

          test -f index.html
          test -f Dockerfile

          echo "Frontend files found:"
          ls -la

          echo "Frontend validation successful!"


  # ==================================================
  # FRONTEND - DOCKER BUILD AND PUSH
  # ==================================================

  frontend-docker:
    name: Frontend - Docker Build & Push
    runs-on: ubuntu-latest

    needs: frontend-build-test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
            echo "======================================"


              docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            echo "Pulling frontend image..."

            docker pull \
              ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

            echo "Stopping old frontend..."

            docker stop frontend || true
            docker rm frontend || true

            echo "Starting new frontend..."

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

            echo "Waiting for frontend..."

            sleep 5

            echo "Testing frontend..."

            curl --fail http://localhost/

            echo ""
            echo "Frontend deployment successful!"


  # ==================================================
  # FINAL VERIFICATION
  # ==================================================

  final-verification:
    name: Final Deployment Verification
    runs-on: ubuntu-latest

            aws ecr get-login-password --region us-east-1 | \
            echo "Logging in to ECR..."
          aws-region: ${{ env.AWS_REGION }}
            echo "FRONTEND DEPLOYMENT"

          script: |
            echo "======================================"

            set -e


      - name: Login to Amazon ECR
        id: login-ecr
    needs:
      - backend-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
        uses: aws-actions/amazon-ecr-login@v2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
      - name: Build frontend Docker image
        working-directory: Frontend deployment
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }} \
        uses: appleboy/ssh-action@v1.2.0
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest \
            .

      - frontend-deploy
      - name: Push frontend Docker image
      - name: Deploy frontend to EC2
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}

          docker push \

            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest


  # ==================================================
  # FRONTEND - DEPLOY TO EC2

    steps:
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
  # ==================================================

  frontend-deploy:
    name: Frontend - Deploy to EC2
    runs-on: ubuntu-latest

      - name: Login to Amazon ECR
    needs: frontend-docker


    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Deployment completed successfully
        run: |

          echo "=========================================="

          echo "       FULL STACK CI/CD SUCCESSFUL"

          echo "=========================================="


          echo "Backend Build:       SUCCESS"
          echo "Backend ECR:         SUCCESS"

          echo "Backend Deployment:  SUCCESS"

          echo "Frontend Build:      SUCCESS"

          echo "Frontend ECR:        SUCCESS"
          echo "Frontend Deployment: SUCCESS"

          echo "MySQL Container:     RUNNING"

          echo "Health Checks:       SUCCESS"


          echo "=========================================="
