```yaml
name: Full Stack CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  BACKEND_ECR_REPOSITORY: contact-backend
  FRONTEND_ECR_REPOSITORY: frontend

jobs:

  backend-build:
    name: Backend Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: Backenddeployment
        run: npm ci

      - name: Check JavaScript
        working-directory: Backenddeployment
        run: node --check server.js

  backend-docker:
    name: Backend Docker Build Push
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend
        working-directory: Backenddeployment
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/contact-backend:${{ github.sha }} \
            .

      - name: Push backend
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/contact-backend:${{ github.sha }}

  backend-deploy:
    name: Backend Deploy
    needs: backend-docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG
          script: |
            set -e

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

            docker pull "$ECR_REGISTRY/contact-backend:$IMAGE_TAG"

            docker stop backend || true
            docker rm backend || true

            docker run -d \
              --name backend \
              --restart unless-stopped \
              --network app-network \
              --env-file /home/ubuntu/backend.env \
              -p 5000:5000 \
              "$ECR_REGISTRY/contact-backend:$IMAGE_TAG"

            sleep 10

            curl --fail http://localhost:5000/

            echo "Backend deployment successful"

  frontend-build:
    name: Frontend Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend
        working-directory: Frontend deployment
        run: |
          test -f index.html
          test -f Dockerfile
          grep -qi "<html" index.html
          echo "Frontend validation successful"

  frontend-docker:
    name: Frontend Docker Build Push
    needs: frontend-build
    runs-on: ubuntu-latest

    steps:
        uses: actions/checkout@v4

      - name: Configure AWS
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend
        working-directory: Frontend deployment
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }} \
            .

      - name: Push frontend
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}

  frontend-deploy:
    name: Frontend Deploy
    needs: frontend-docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG
          script: |
            set -e

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

            docker pull "$ECR_REGISTRY/frontend:$IMAGE_TAG"

            docker stop frontend || true
            docker rm frontend || true

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              "$ECR_REGISTRY/frontend:$IMAGE_TAG"

            sleep 5

            curl --fail http://localhost/

            echo "Frontend deployment successful"

  final-verification:
    name: Final Verification
    needs:
      - backend-deploy
      - frontend-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Docker containers:"
            docker ps

            echo "Backend:"
            curl --fail http://localhost:5000/

            echo "Backend API:"
            curl --fail http://localhost:5000/api/recipes

        uses: aws-actions/configure-aws-credentials@v4
            echo "Frontend:"
            curl --fail http://localhost/

            echo "MySQL:"
            docker ps --filter "name=mysql"

            echo "FULL STACK DEPLOYMENT SUCCESSFUL"
```

