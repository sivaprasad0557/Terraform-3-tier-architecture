```yaml
name: Full Stack CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "Backenddeployment/**"
      - "Frontend deployment/**"
      - ".github/workflows/fullstack-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Backenddeployment/**"
      - "Frontend deployment/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "435957166878"
  BACKEND_ECR_REPOSITORY: contact-backend
  FRONTEND_ECR_REPOSITORY: frontend

jobs:

  # ==========================================
  # BACKEND BUILD AND TEST
  # ==========================================

  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backenddeployment/package-lock.json

      - name: Install dependencies
        working-directory: Backenddeployment
        run: npm ci

      - name: Validate JavaScript
        working-directory: Backenddeployment
        run: node --check server.js

      - name: Check backend files
        working-directory: Backenddeployment
        run: |
          test -f package.json
          test -f package-lock.json
          test -f server.js
          test -f Dockerfile
          echo "Backend validation successful"

  # ==========================================
  # BACKEND DOCKER BUILD AND PUSH
  # ==========================================

  backend-docker:
    name: Backend Docker Build and Push
    needs: backend-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        working-directory: Backenddeployment
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest \
            .

      - name: Push backend commit image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push backend latest image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest

  # ==========================================
  # BACKEND DEPLOYMENT
  # ==========================================

  backend-deploy:
    name: Deploy Backend to EC2
    needs: backend-docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG
          script: |
            set -e

            echo "=========================================="
            echo "BACKEND DEPLOYMENT"
            echo "=========================================="

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

            echo "Pulling backend image..."

            docker pull \
              "$ECR_REGISTRY/contact-backend:$IMAGE_TAG"

            echo "Stopping old backend container..."

            docker stop backend || true
            docker rm backend || true

            echo "Starting new backend container..."

            docker run -d \
              --name backend \
              --restart unless-stopped \
              --network app-network \
              --env-file /home/ubuntu/backend.env \
              -p 5000:5000 \
              "$ECR_REGISTRY/contact-backend:$IMAGE_TAG"

            echo "Waiting for backend..."

            sleep 10

            echo "Testing backend..."

            curl --fail http://localhost:5000/

            echo "Testing backend API..."

            curl --fail http://localhost:5000/api/recipes

            echo "Backend deployment successful"

  # ==========================================
  # FRONTEND BUILD AND TEST
  # ==========================================

  frontend-build-test:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        working-directory: Frontend deployment
        run: |
          test -f index.html
          test -f Dockerfile
          echo "Frontend files found"
          ls -la

      - name: Validate HTML
        working-directory: Frontend deployment
        run: |
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          echo "Frontend HTML validation successful"

  # ==========================================
  # FRONTEND DOCKER BUILD AND PUSH
  # ==========================================

  frontend-docker:
    name: Frontend Docker Build and Push
    needs: frontend-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        working-directory: Frontend deployment
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest \
            .

      - name: Push frontend commit image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push frontend latest image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest

  # ==========================================
  # FRONTEND DEPLOYMENT
  # ==========================================

  frontend-deploy:
    name: Deploy Frontend to EC2
    needs: frontend-docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::435957166878:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          envs: ECR_REGISTRY,IMAGE_TAG
          script: |
            echo "FRONTEND DEPLOYMENT"


            aws ecr get-login-password --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \

            echo "Pulling frontend image..."

            docker pull \
              "$ECR_REGISTRY/frontend:$IMAGE_TAG"

            echo "Stopping old frontend container..."

            docker stop frontend || true
            docker rm frontend || true

            echo "Starting new frontend container..."

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              "$ECR_REGISTRY/frontend:$IMAGE_TAG"

            echo "Waiting for frontend..."
            sleep 5

            echo "Testing frontend..."

            curl --fail http://localhost/

            echo "Frontend deployment successful"

  # ==========================================
  # FINAL VERIFICATION
  # ==========================================

  final-verification:
    name: Final Application Verification
    needs:
      - frontend-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify complete application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=========================================="
            echo "FINAL APPLICATION VERIFICATION"
            echo "=========================================="

            echo ""
            echo "Docker containers:"
            docker ps

            echo ""
            echo "Testing backend:"
            curl --fail http://localhost:5000/

            echo ""
            echo "Testing backend API:"
            curl --fail http://localhost:5000/api/recipes

            echo ""
            echo "Testing frontend:"
            curl --fail http://localhost/

            echo ""
            echo "Checking MySQL:"
            docker ps --filter "name=mysql"

            echo ""
            echo "=========================================="
            echo "FULL STACK DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
