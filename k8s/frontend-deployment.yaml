apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 657566734724.dkr.ecr.us-east-1.amazonaws.com/three-tier-frontend:v1
          ports:
            - containerPort: 80
